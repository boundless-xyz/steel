[workspace]
resolver = "2"
members = ["core", "host", "methods"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
debug = 1
lto = true

[workspace.dependencies]
# Intra-workspace dependencies
risc0-steel = { path = "../../crates/steel" }

# risc0 dependencies
risc0-build = { version = "3.0" }
risc0-zkvm = { version = "3.0" }
risc0-ethereum-contracts = { version = "3.0" }
risc0-build-ethereum = { version = "3.0" }

alloy = { version = "1.0" }
alloy-primitives = { version = "1.0", features = ["rlp", "serde"] }
alloy-sol-types = { version = "1.0" }
anyhow = { version = "1.0.75" }
clap = { version = "4.5" }
dotenvy = { version = "0.15" }
erc20-counter-methods = { path = "./methods" }
erc20-counter-core = { path = "./core" }
log = { version = "0.4" }
serde = { version = "1.0", features = ["derive"] }
test-log = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.39", features = ["full"] }
url = { version = "2.5" }
