[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
homepage = "https://beboundless.xyz/"
repository = "https://github.com/boundless-xyz/steel/"

[workspace.lints.rust]
# Deny Lints (Will cause the build to fail)
rust-2018-idioms = "deny"
unused-must-use = "deny"
unsafe-code = "deny"
# Warn Lints (Will only print warnings)
missing-debug-implementations = "warn"
missing-docs = "warn"
unreachable-pub = "warn"
unnameable-types = "warn"

[workspace.dependencies]
# Intra-workspace dependencies
risc0-op-steel = { path = "crates/op-steel", default-features = false }
risc0-steel = { path = "crates/steel", default-features = false }

# Alloy guest dependencies
alloy-consensus = { version = "1.0" }
alloy-eips = { version = "1.0" }
alloy-evm = { version = "0.30" }
alloy-rlp = { version = "0.3.8" }
alloy-primitives = { version = "1.3" }
alloy-rpc-types = { version = "1.0" }
alloy-sol-types = { version = "1.3" }

# OP Steel
alloy-op-evm = { version = "0.30" }
op-alloy-consensus = { version = "0.24" }
op-alloy-rpc-types = { version = "0.24" }

# Alloy host dependencies
alloy = { version = "1.0", default-features = false }
alloy-trie = { version = "0.8" }

# Beacon chain support
context_deserialize = "0.2"
lighthouse-types = { git = "https://github.com/sigp/lighthouse.git", tag = "v8.1.3", package = "types" }
tree_hash = "0.12"

anyhow = { version = "1.0" }
bincode = { version = "1.3" }
delegate = "0.13"
enumn = "0.1"
log = "0.4"
revm = { version = "36.0.0", default-features = false, features = ["std"] }
op-revm = { version = "17.0.0", default-features = false, features = ["std"] }
serde = "1.0"
serde_json = "1.0"
sha2 = { version = "0.10" }
test-log = "0.2.15"
thiserror = { version = "2.0" }
tokio = { version = "1.35" }
url = { version = "2.5" }
